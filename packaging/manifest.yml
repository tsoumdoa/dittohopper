name: dittohopper
version: "@VERSION@"
authors:
  - aectooling by tomoS
license: MIT
description: >
  Compare two Rhino models and see what changed, and just as clearly what did
  not. The DittoReview command opens a review panel and draws the changes in
  the viewport; Grasshopper components automate diffs and QA gates. Each change
  is reported once, at its root cause; every matched pair says how it was
  matched.
